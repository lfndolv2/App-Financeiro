        <input class="f-input" style="border:none;background:transparent;padding:0;flex:1" id="f-due" type="number" placeholder="dia —" min="1" max="31" value="${e&&e.dueDay?e.dueDay:''}">
      </div>`:''}
      ${curT==='despesa'?`<div class="tbl-row" style="cursor:default;gap:8px" id="wp-parc">
        <span style="font-size:15px;color:#8E8E93;min-width:40px">Parcelas</span>
        <input class="f-input" style="border:none;background:transparent;padding:0;flex:1;text-align:right" id="f-parc" type="number" min="1" max="60" value="${e?e.parcelas:1}">
      </div>`:''}
    </div>
  </div>
  <div class="f-section">
    <div class="tbl-body">
      <div class="tbl-row" style="cursor:default">
        <label class="toggle-row" style="width:100%">
          <span>Já ${curT==='receita'?'recebido':'pago'}</span>
          <input type="checkbox" id="f-paid"${e&&e.paid?' checked':''}>
        </label>
      </div>
      <div class="tbl-row" style="cursor:default">
        <label class="toggle-row" style="width:100%">
          <span>Recorrente todo mês</span>
          <input type="checkbox" id="f-rec"${e&&e.recurring?' checked':''}>
        </label>
      </div>
    </div>
  </div>
  ${isGrp?`<div class="f-section">
    <div class="f-label">Aplicar em</div>
    <div class="tbl-body">
      <div class="scope-row on" id="sc-only" onclick="selScope('only')"><div class="scope-radio"></div><div><div class="scope-t">Só este mês</div><div class="scope-s">${MONTHS_FULL[e.month]} ${e.year}</div></div></div>
      <div class="scope-row" id="sc-fut" onclick="selScope('future')"><div class="scope-radio"></div><div><div class="scope-t">Este e os ${e.recurring?'futuros':'próximos'}</div><div class="scope-s">Propaga daqui pra frente</div></div></div>
    </div>
    <input type="hidden" id="scope-fut" value="">
  </div>`:''}`;
}

function formFoot(e){
  return e
    ?`<button class="btn btn-blue" onclick="doSaveEdit('${e.id}')">Salvar</button><button class="btn btn-ghost" onclick="closeSheet()">Cancelar</button>`
    :`<button class="btn btn-blue" onclick="doSaveEntry()">Adicionar</button><button class="btn btn-ghost" onclick="closeSheet()">Cancelar</button>`;
}

function setMType(t){
  mType=t;
  document.getElementById('tp-rec').className='seg-btn'+(t==='receita'?' on rec':'');
  document.getElementById('tp-desp').className='seg-btn'+(t==='despesa'?' on desp':'');
  ['wp-cat','wp-met','wp-parc'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=t==='despesa'?'':'none';});
  // update amount color
  const fv=document.getElementById('f-value');if(fv)fv.style.color=t==='receita'?'var(--green)':'var(--red)';
}
function setMetodo(m){
  const h=document.getElementById('f-metodo');if(h)h.value=m;
  ['din','deb','cre'].forEach(k=>{const b=document.getElementById('mp-'+k);if(b)b.classList.toggle('on',k===m.slice(0,3));});
  const c=document.getElementById('f-cat');
  if(c){if(m==='credito'){c.value='cartao';c.disabled=true;}else{c.disabled=false;}}
}
function selScope(w){
  const h=document.getElementById('scope-fut');if(h)h.value=w==='future'?'1':'';
  const o=document.getElementById('sc-only'),f=document.getElementById('sc-fut');
  if(o)o.classList.toggle('on',w==='only');if(f)f.classList.toggle('on',w==='future');
}

function doSaveEntry(){
  const desc=document.getElementById('f-desc').value.trim();
  const value=parseFloat(document.getElementById('f-value').value);
  const month=parseInt(document.getElementById('f-month').value);
  const year=parseInt(document.getElementById('f-year').value);
  const paid=document.getElementById('f-paid').checked;
  const parcEl=document.getElementById('f-parc');
  const parc=mType==='despesa'?(parcEl?parseInt(parcEl.value)||1:1):1;
  const mEl=document.getElementById('f-metodo');
  const metodo=mType==='despesa'?(mEl?mEl.value:'dinheiro'):null;
  const catEl=document.getElementById('f-cat');
  const cat=mType==='despesa'?(metodo==='credito'?'cartao':(catEl?catEl.value:'outros')):'receita';
  const rec=document.getElementById('f-rec').checked;
  const dueEl=document.getElementById('f-due');
  const dueDay=mType==='despesa'&&dueEl?parseInt(dueEl.value)||null:null;
  if(!desc||!value||value<=0){toast('Preencha descrição e valor');return;}
  if(rec){
    const rid=genId();
    for(let i=0;i<18;i++){const rM=month+i;entries.push({id:genId(),type:mType,cat,desc,value:Math.round(value*100)/100,month:rM%12,year:year+Math.floor(rM/12),paid:i===0?paid:false,parcelas:1,parcelaAtual:1,recurring:true,recurId:rid,recurActive:true,dueDay,metodo});}
    saveAll();closeSheet();render();toast('Recorrência criada');return;
  }
  const gid=parc>1?genId():undefined;
  for(let i=0;i<parc;i++){const rM=month+i;entries.push({id:genId(),type:mType,cat,desc,value:Math.round(value*100)/100,month:rM%12,year:year+Math.floor(rM/12),paid:i===0?paid:false,parcelas:parc,parcelaAtual:i+1,recurring:rec,groupId:gid,dueDay,metodo});}
  saveAll();closeSheet();render();toast(parc>1?`${parc} parcelas lançadas`:'Lançado');
}

function doSaveEdit(id){
  const desc=document.getElementById('f-desc').value.trim();
  const value=parseFloat(document.getElementById('f-value').value);
  const month=parseInt(document.getElementById('f-month').value);
  const year=parseInt(document.getElementById('f-year').value);
  const paid=document.getElementById('f-paid').checked;
  const mEl=document.getElementById('f-metodo');
  const metodo=mType==='despesa'?(mEl?mEl.value:'dinheiro'):null;
  const catEl=document.getElementById('f-cat');
  const cat=mType==='despesa'?(metodo==='credito'?'cartao':(catEl?catEl.value:'outros')):'receita';
  const rec=document.getElementById('f-rec').checked;
  const dueEl=document.getElementById('f-due');
  const dueDay=mType==='despesa'&&dueEl?parseInt(dueEl.value)||null:null;
  const npEl=document.getElementById('f-parc');
  const nTotal=npEl?parseInt(npEl.value)||1:1;
  if(!desc||!value||value<=0){toast('Preencha!');return;}
  const scEl=document.getElementById('scope-fut');
  const applyF=scEl&&scEl.value==='1';
  const orig=entries.find(x=>x.id===id);
  if(applyF&&orig&&(orig.parcelas>1||orig.recurring)){
    if(orig.recurring){
      entries=entries.map(x=>{
        const same=orig.recurId?(x.recurring&&x.recurId===orig.recurId):(x.recurring&&x.desc===orig.desc&&x.cat===orig.cat&&x.type===orig.type);
        const fut=(x.year>orig.year)||(x.year===orig.year&&x.month>=orig.month);
        if(same&&fut)return{...x,desc,value:Math.round(value*100)/100,cat,type:mType,recurring:rec,dueDay,metodo,paid:(x.id===id)?paid:x.paid};
        return x;
      });toast('Recorrência atualizada');
    } else {
      const gid=orig.groupId||orig.id,from=orig.parcelaAtual;
      entries=entries.map(x=>(x.groupId===gid&&x.parcelaAtual<from)?{...x,parcelas:nTotal}:x);
      entries=entries.filter(x=>!(x.groupId===gid&&x.parcelaAtual>=from));
      const rem=Math.max(1,nTotal-(from-1));
      for(let i=0;i<rem;i++){const rM=month+i;const first=i===0;entries.push({id:first?id:genId(),type:mType,cat,desc,value:Math.round(value*100)/100,month:rM%12,year:year+Math.floor(rM/12),paid:first?paid:false,parcelas:nTotal,parcelaAtual:from+i,recurring:false,groupId:gid,dueDay,metodo});}
      toast('Parcelas atualizadas');
    }
  } else {
    entries=entries.map(x=>x.id===id?{...x,desc,value:Math.round(value*100)/100,month,year,paid,cat,type:mType,recurring:rec,dueDay,metodo}:x);
    toast('Atualizado');
  }
  saveAll();closeSheet();render();
}

/* ── Quitar ── */
function openQuitar(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  const gid=e.groupId||e.id,fut=entries.filter(x=>x.groupId===gid&&x.parcelaAtual>=e.parcelaAtual);
  const rest=fut.reduce((s,x)=>s+x.value,0);
  openSheet('Quitar parcelas',`
    <div class="f-section">
      <div class="tbl-body">
        <div class="tbl-row" style="cursor:default"><div class="row-body"><div class="row-title">${e.desc}</div><div class="row-detail">${fut.length} parcelas restantes · ${fmt(rest)}</div></div></div>
      </div>
    </div>
    <div class="f-section">
      <div class="f-label">Valor a pagar</div>
      <div class="tbl-body"><div class="tbl-row" style="cursor:default"><input class="f-input" style="border:none;background:transparent;padding:0" id="q-val" type="number" min="0" step="0.01" value="${rest.toFixed(2)}"></div></div>
    </div>
    <div class="f-section">
      <div class="f-label">Descrição</div>
      <div class="tbl-body"><div class="tbl-row" style="cursor:default"><input class="f-input" style="border:none;background:transparent;padding:0" id="q-desc" type="text" value="Quitação — ${e.desc.replace(/"/g,'&quot;')}"></div></div>
    </div>
    <div class="f-section">
      <div class="f-label">Mês do pagamento</div>
      <div class="tbl-body">
        <div class="tbl-row" style="cursor:default;gap:8px">
          <select class="f-input" style="border:none;background:transparent;padding:0;flex:1" id="q-month">${MONTHS.map((m,i)=>`<option value="${i}"${viewMonth===i?' selected':''}>${m}</option>`).join('')}</select>
          <input class="f-input" style="border:none;background:transparent;padding:0;width:56px;text-align:right" id="q-year" type="number" value="${viewYear}">
        </div>
      </div>
    </div>
    <div class="tbl-body"><div class="tbl-row" style="cursor:default"><label class="toggle-row" style="width:100%"><span>Já paguei</span><input type="checkbox" id="q-paid" checked></label></div></div>
  `,`<button class="btn btn-blue" onclick="doQuitar('${id}')">Confirmar quitação</button><button class="btn btn-ghost" onclick="closeSheet()">Cancelar</button>`);
}
function doQuitar(id){
  const e=entries.find(x=>x.id===id);if(!e)return;const gid=e.groupId||e.id;
  const val=parseFloat(document.getElementById('q-val').value);
  const desc=document.getElementById('q-desc').value.trim();
  const month=parseInt(document.getElementById('q-month').value);
  const year=parseInt(document.getElementById('q-year').value);
  const paid=document.getElementById('q-paid').checked;
  if(!val||val<=0||!desc){toast('Preencha!');return;}
  entries=entries.filter(x=>!(x.groupId===gid&&x.parcelaAtual>=e.parcelaAtual));
  entries.push({id:genId(),type:'despesa',cat:e.cat,desc,value:Math.round(val*100)/100,month,year,paid,parcelas:1,parcelaAtual:1,recurring:false,dueDay:null,quitacao:true});
  saveAll();closeSheet();render();toast('Quitado 🎉');
}

/* ── Excluir ── */
function delOne(id){if(!confirm('Excluir este lançamento?'))return;entries=entries.filter(e=>e.id!==id);saveAll();render();toast('Excluído');}
function openDelSheet(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  const isP=e.parcelas>1,isR=e.recurring;
  openSheet('Excluir lançamento',`
    <div style="background:var(--fill);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:15px;color:#8E8E93">"${e.desc}" · ${fmt(e.value)}</div>
    <div class="tbl-body">
      <div class="action-opt" onclick="delOnly('${id}')"><div class="ao-ico">📅</div><div><div class="ao-t">Só este mês</div><div class="ao-s">${MONTHS_FULL[e.month]} ${e.year}</div></div></div>
      ${isP?`<div class="action-opt" onclick="delFrom('${id}')"><div class="ao-ico">📅</div><div><div class="ao-t">Este e os próximos</div><div class="ao-s">A partir de ${MONTHS_FULL[e.month]}</div></div></div>`:''}
      ${isR?`<div class="action-opt" onclick="delFrom('${id}')"><div class="ao-ico">⏹</div><div><div class="ao-t">Parar recorrência</div><div class="ao-s">Daqui pra frente</div></div></div>`:''}
      ${(isP||isR)?`<div class="action-opt ao-danger" onclick="delAll('${id}')"><div class="ao-ico">🗑</div><div><div class="ao-t">Excluir todos</div><div class="ao-s">${isP?'Todas as parcelas':'Toda a recorrência'}</div></div></div>`:''}
    </div>
  `,`<button class="btn btn-ghost" onclick="closeSheet()">Cancelar</button>`);
}
function delOnly(id){entries=entries.filter(e=>e.id!==id);saveAll();closeSheet();render();toast('Excluído');}
function delFrom(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  if(e.recurring&&e.recurId){
    entries=entries.map(x=>x.recurId===e.recurId?{...x,recurActive:false}:x);
    entries=entries.filter(x=>!(x.recurId===e.recurId&&((x.year>e.year)||(x.year===e.year&&x.month>=e.month))));
    saveAll();closeSheet();render();toast('Recorrência interrompida');return;
  }
  const gid=e.groupId||e.id;
  entries=entries.filter(x=>!(x.groupId===gid&&x.parcelaAtual>=e.parcelaAtual)&&x.id!==id);
  saveAll();closeSheet();render();toast('Parcelas removidas');
}
function delAll(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  if(e.recurring){e.recurId?entries=entries.filter(x=>x.recurId!==e.recurId):entries=entries.filter(x=>!(x.desc===e.desc&&x.cat===e.cat&&x.type===e.type&&x.recurring));}
  else{const gid=e.groupId||e.id;entries=entries.filter(x=>x.groupId!==gid&&x.id!==id);}
  saveAll();closeSheet();render();toast('Excluídos');
}

/* ── Metas ── */
const GOAL_COLORS=['#34C759','#007AFF','#FF3B30','#FF9500','#AF52DE','#FF2D55'];
let _gC=GOAL_COLORS[0];
function openGoalSheet(){
  _gC=GOAL_COLORS[0];
  openSheet('Nova meta',`
    <div class="f-section">
      <div class="tbl-body">
        <div class="tbl-row" style="cursor:default"><input class="f-input" style="border:none;background:transparent;padding:0" id="g-name" type="text" placeholder="Nome da meta"></div>
      </div>
    </div>
    <div class="f-section">
      <div class="f-label">Valores</div>
      <div class="tbl-body">
        <div class="tbl-row" style="cursor:default;gap:8px"><span style="font-size:15px;color:#8E8E93;white-space:nowrap">Valor alvo</span><input class="f-input" style="border:none;background:transparent;padding:0;text-align:right;flex:1" id="g-target" type="number" placeholder="10.000"></div>
        <div class="tbl-row" style="cursor:default;gap:8px"><span style="font-size:15px;color:#8E8E93;white-space:nowrap">Já tenho</span><input class="f-input" style="border:none;background:transparent;padding:0;text-align:right;flex:1" id="g-cur" type="number" placeholder="0" value="0"></div>
        <div class="tbl-row" style="cursor:default;gap:8px"><span style="font-size:15px;color:#8E8E93;white-space:nowrap">Prazo</span><input class="f-input" style="border:none;background:transparent;padding:0;text-align:right;flex:1" id="g-dl" type="month"></div>
      </div>
    </div>
    <div class="f-section">
      <div class="f-label">Cor</div>
      <div style="padding:4px 0"><div class="color-row">${GOAL_COLORS.map(c=>`<div class="color-dot${_gC===c?' on':''}" style="background:${c}" onclick="pickGC('${c}')"></div>`).join('')}</div></div>
    </div>
  `,`<button class="btn btn-blue" onclick="doSaveGoal()">Criar meta</button><button class="btn btn-ghost" onclick="closeSheet()">Cancelar</button>`);
}
function pickGC(c){_gC=c;document.querySelectorAll('#sh-body .color-dot').forEach(d=>d.classList.toggle('on',d.style.background===c));}
function doSaveGoal(){
  const name=document.getElementById('g-name').value.trim();
  const target=parseFloat(document.getElementById('g-target').value);
  const current=parseFloat(document.getElementById('g-cur').value)||0;
  const deadline=document.getElementById('g-dl').value;
  if(!name||!target||target<=0){toast('Preencha nome e valor');return;}
  goals.push({id:genId(),name,target,current,deadline,color:_gC});
  saveAll();closeSheet();render();toast('Meta criada');
}

/* ── Categorias ── */
let _cC=CAT_COLORS[0],_cE=CAT_EMOJIS[0];
function openCatSheet(key){
  const CATS=getCats(),ex=key?CATS[key]:null;
  if(ex){_cC=ex.color;_cE=ex.icon;}else{_cC=CAT_COLORS[0];_cE=CAT_EMOJIS[0];}
  openSheet(ex?'Editar categoria':'Nova categoria',`
    <div class="f-section">
      <div style="display:flex;align-items:center;gap:14px;background:var(--fill);border-radius:12px;padding:14px;margin-bottom:16px">
        <div id="cp-ico" style="width:44px;height:44px;border-radius:11px;background:${_cC};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">${_cE}</div>
        <div id="cp-name" style="font-size:17px;font-weight:500">${ex?ex.label:'Nova categoria'}</div>
      </div>
      <div class="tbl-body">
        <div class="tbl-row" style="cursor:default"><input class="f-input" style="border:none;background:transparent;padding:0" id="cat-name" type="text" placeholder="Nome" value="${ex?ex.label.replace(/"/g,'&quot;'):''}" oninput="document.getElementById('cp-name').textContent=this.value||'Nova categoria'"></div>
      </div>
    </div>
    <div class="f-section">
      <div class="f-label">Ícone</div>
      <div class="emoji-grid">${CAT_EMOJIS.map(em=>`<button class="emoji-btn${_cE===em?' on':''}" onclick="pickE('${em}')">${em}</button>`).join('')}</div>
    </div>
    <div class="f-section">
      <div class="f-label">Cor</div>
      <div class="color-row">${CAT_COLORS.map(c=>`<div class="color-dot${_cC===c?' on':''}" style="background:${c}" onclick="pickCC('${c}')"></div>`).join('')}</div>
    </div>
  `,`<button class="btn btn-blue" onclick="doSaveCat('${key||''}')">Salvar</button><button class="btn btn-ghost" onclick="closeSheet()">Cancelar</button>`);
}
function pickE(em){_cE=em;document.querySelectorAll('#sh-body .emoji-btn').forEach(b=>b.classList.toggle('on',b.textContent===em));const ic=document.getElementById('cp-ico');if(ic)ic.textContent=em;}
function pickCC(c){_cC=c;document.querySelectorAll('#sh-body .color-dot').forEach(d=>d.classList.toggle('on',d.style.background===c));const ic=document.getElementById('cp-ico');if(ic)ic.style.background=c;}
function doSaveCat(key){
  const name=document.getElementById('cat-name').value.trim();if(!name){toast('Digite um nome');return;}
  if(!key){const k='cat_'+genId();customCats[k]={label:name,color:_cC,icon:_cE,isDefault:false};}
  else customCats[key]={...(customCats[key]||{}),label:name,color:_cC,icon:_cE};
  saveAll();closeSheet();render();toast(key?'Categoria atualizada':'Categoria criada');
}
function delCat(key,n){
  if(n>0){if(!confirm(`${n} lançamento(s) vão para "Outros". Continuar?`))return;}
  else if(!confirm('Remover esta categoria?'))return;
  entries=entries.map(e=>e.cat===key?{...e,cat:'outros'}:e);customCats[key]=null;saveAll();render();toast('Removida');
}

/* ── INIT ── */
document.getElementById('sheet-bg').addEventListener('click',closeSheet);
const fab=document.getElementById('fab');if(fab)fab.style.display='flex';
if(hideValues){const b=document.getElementById('btn-eye');if(b)b.textContent='🙈';}
render();
</script>
</body>
